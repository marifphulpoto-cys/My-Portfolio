<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Circular Path for DEFEND DETECT RESPOND -->
    <path id="textPathTop" d="M 25,100 A 75,75 0 0,1 175,100" fill="none" />
    <path id="textPathBottom" d="M 170,105 A 72,72 0 0,1 30,105" fill="none" />
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B3A6B" />
      <stop offset="100%" stop-color="#081021" />
    </radialGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35D0FF" />
      <stop offset="100%" stop-color="#2F8FD8" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Navy Ring -->
  <circle cx="100" cy="100" r="94" fill="#060C1B" stroke="#2F8FD8" stroke-width="2.5" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="#35D0FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Top Text: DEFEND • DETECT • RESPOND -->
  <text fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="9.5" font-weight="700" letter-spacing="2.2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      ♦ DEFEND ♦ DETECT ♦ RESPOND ♦
    </textPath>
  </text>

  <!-- Bottom Text: ARIFSEC.COM -->
  <text fill="#35D0FF" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="11" font-weight="800" letter-spacing="3.5">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      ARIFSEC.COM
    </textPath>
  </text>

  <!-- Inner Circle Shield Container -->
  <circle cx="100" cy="100" r="62" fill="url(#shieldGlow)" stroke="#2F8FD8" stroke-width="1.8" />

  <!-- The Shield -->
  <path d="M100 52 L132 68 C132 108 100 138 100 138 C100 138 68 108 68 68 Z" fill="#0A1633" stroke="url(#blueAccent)" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M100 58 L126 71 C126 103 100 128 100 128 C100 128 74 103 74 71 Z" fill="#070E22" stroke="#35D0FF" stroke-width="1" opacity="0.7"/>

  <!-- Stylized Letter 'A' in Blue & Cyan -->
  <path d="M100 68 L117 114 H107 L102.5 101 H97.5 L93 114 H83 Z M99 82 L96.5 94 H103.5 Z" fill="#FFFFFF"/>
  <path d="M93 114 L100 68 L107 114 Z" fill="#35D0FF" opacity="0.25"/>
</svg>
